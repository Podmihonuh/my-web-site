<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — GameProfile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🎮</span>
      <span class="logo-text">GameProfile</span>
    </div>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="about.html">Обо мне</a>
      <a href="blog.html">Блог</a>
      <a href="contact.html" class="active">Контакты</a>
      <button id="theme-toggle" class="theme-btn" aria-label="Переключить тему">🌙</button>
    </nav>
  </header>

  <main class="page-content">
    <h1>Контакты</h1>
    <p>Связаться со мной можно через:</p>
    <ul class="contact-list">
      <li>📧 Email: <a href="mailto:player@example.com">player@example.com</a></li>
      <li>💬 Discord: PlayerOne#1234</li>
      <li>🎮 Steam: <a href="#">steamcommunity.com/id/playerone</a></li>
    </ul>

    <h2>Форма связи</h2>
    <form id="contact-form" class="contact-form">
      <label for="name">Имя</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Сообщение</label>
      <textarea id="message" name="message" rows="4" required></textarea>

      <button type="submit" class="btn">Отправить</button>
      <p id="form-message" class="form-message"></p>
    </form>
  </main>

  <footer class="footer">
    <p>© 2025 GameProfile. Сделано с ❤️ к играм.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
